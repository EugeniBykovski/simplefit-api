name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Elixir/OTP versions come from .tool-versions (single source of truth).
  BEAM_VERSION_FILE: .tool-versions

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
    services:
      postgres:
        # The official image from the AWS ECR Public mirror of Docker Official
        # Images: anonymous Docker Hub pulls hit the shared runners' rate limit.
        image: public.ecr.aws/docker/library/postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          version-file: ${{ env.BEAM_VERSION_FILE }}
          version-type: strict

      - name: Restore dependency and build cache
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-test-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-test-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-

      - name: Install dependencies
        run: mix deps.get --check-locked

      - name: Check for unused dependencies
        run: mix deps.unlock --check-unused

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Run tests
        run: mix test --warnings-as-errors

  quality:
    name: Quality
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          version-file: ${{ env.BEAM_VERSION_FILE }}
          version-type: strict

      - name: Restore dependency and build cache
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-dev-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-dev-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-

      - name: Install dependencies
        run: mix deps.get --check-locked

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Credo
        run: mix credo --strict

      - name: OpenAPI contract (validation + drift)
        run: mix openapi.check

      - name: Restore Dialyzer PLT cache
        id: plt-cache
        uses: actions/cache/restore@v6
        with:
          path: priv/plts
          key: plt-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            plt-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-

      - name: Build Dialyzer PLT
        if: steps.plt-cache.outputs.cache-hit != 'true'
        run: mix dialyzer --plt

      - name: Save Dialyzer PLT cache
        if: steps.plt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: priv/plts
          key: ${{ steps.plt-cache.outputs.cache-primary-key }}

      - name: Dialyzer
        run: mix dialyzer --format github

  openapi-lint:
    name: OpenAPI lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Lint OpenAPI artifact (Redocly, recommended-strict)
        run: npx --yes @redocly/cli@2.57.0 lint

  commit-messages:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "Commit headers follow <type>: SF-<ticket> - <description>"
        run: >-
          .github/scripts/check-commit-messages.sh
          ${{ github.event.pull_request.base.sha }}
          ${{ github.event.pull_request.head.sha }}
